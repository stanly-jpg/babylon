<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Babylon Projects</title>
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <style>
    :root {
      --sidebar-w: 280px;
    }
    * {
      box-sizing: border-box;
    }
    html, body {
      overflow: hidden;
      width: 100%;
      height: 100%;
      margin: 0;
      padding: 0;
      background: #05070d;
      color: #eef1fb;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
    }

    /* ---- Sidebar ---- */
    #sidebar {
      position: fixed;
      top: 0;
      left: 0;
      bottom: 0;
      width: var(--sidebar-w);
      max-width: 84vw;
      background: radial-gradient(circle at 20% -10%, #1b1330 0%, #0a0c16 60%, #05060c 100%);
      border-right: 1px solid rgba(255, 255, 255, 0.09);
      transform: translateX(-100%);
      transition: transform 0.25s ease;
      z-index: 40;
      display: flex;
      flex-direction: column;
      overflow-y: auto;
    }
    #sidebar.open {
      transform: translateX(0);
    }
    .sidebar-header {
      padding: 22px 20px 14px;
      flex: 0 0 auto;
    }
    .eyebrow {
      display: inline-block;
      font-size: 11px;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: #9fb3ff;
      background: rgba(120, 140, 255, 0.12);
      border: 1px solid rgba(120, 140, 255, 0.3);
      padding: 3px 9px;
      border-radius: 999px;
      margin-bottom: 14px;
    }
    .sidebar-header h1 {
      font-size: 19px;
      margin: 0 0 6px;
      font-weight: 700;
      letter-spacing: -0.01em;
    }
    .sidebar-header p {
      font-size: 12.5px;
      color: #aab0c8;
      margin: 0;
      line-height: 1.45;
    }
    #projectList {
      display: flex;
      flex-direction: column;
      gap: 8px;
      padding: 6px 14px 20px;
      flex: 1 1 auto;
    }
    .projectItem {
      appearance: none;
      text-align: left;
      border: 1px solid rgba(255, 255, 255, 0.09);
      background: linear-gradient(160deg, rgba(255, 255, 255, 0.06), rgba(255, 255, 255, 0.015));
      border-radius: 14px;
      padding: 12px 14px;
      color: inherit;
      cursor: pointer;
      font-family: inherit;
      transition: border-color 0.15s ease, background 0.15s ease;
    }
    .projectItem:hover {
      background: linear-gradient(160deg, rgba(255, 255, 255, 0.09), rgba(255, 255, 255, 0.03));
    }
    .projectItem.active {
      border-color: rgba(159, 179, 255, 0.6);
      background: linear-gradient(160deg, rgba(120, 140, 255, 0.2), rgba(120, 140, 255, 0.04));
    }
    .projectItem .tag {
      display: block;
      font-size: 10px;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: #9fb3ff;
      margin-bottom: 4px;
    }
    .projectItem .name {
      display: block;
      font-size: 14.5px;
      font-weight: 650;
    }
    .sidebar-footer {
      flex: 0 0 auto;
      padding: 12px 20px 18px;
      font-size: 11px;
      color: #666d85;
      border-top: 1px solid rgba(255, 255, 255, 0.06);
    }
    .sidebar-footer a {
      color: #9fb3ff;
    }

    #sidebarBackdrop {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.5);
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.2s ease;
      z-index: 35;
    }
    #sidebar.open ~ #sidebarBackdrop {
      opacity: 1;
      pointer-events: auto;
    }
    @media (min-width: 900px) {
      #sidebar.open ~ #sidebarBackdrop {
        opacity: 0;
        pointer-events: none;
      }
      #sidebar.open ~ #viewer {
        margin-left: var(--sidebar-w);
      }
    }

    /* ---- Viewer ---- */
    #viewer {
      position: fixed;
      inset: 0;
      margin-left: 0;
      transition: margin-left 0.25s ease;
      display: flex;
      flex-direction: column;
      background: #05070d;
      z-index: 10;
    }
    #topbar {
      flex: 0 0 auto;
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 12px 16px;
      z-index: 15;
    }
    #sidebarToggle {
      appearance: none;
      flex: 0 0 auto;
      width: 38px;
      height: 38px;
      border-radius: 999px;
      border: 1px solid rgba(234, 242, 255, 0.2);
      background: rgba(20, 24, 36, 0.7);
      color: #eaf2ff;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      backdrop-filter: blur(6px);
      transition: background 0.15s ease, border-color 0.15s ease;
    }
    #sidebarToggle:hover {
      background: rgba(20, 24, 36, 0.95);
      border-color: rgba(234, 242, 255, 0.5);
    }
    #topbar .titles {
      min-width: 0;
      text-shadow: 0 1px 3px rgba(0, 0, 0, 0.6);
    }
    #topbar .titles h2 {
      margin: 0;
      font-size: 17px;
      font-weight: 600;
      letter-spacing: 0.2px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    #topbar .titles p {
      margin: 2px 0 0;
      font-size: 12px;
      opacity: 0.7;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    #canvasWrap {
      position: relative;
      flex: 1 1 auto;
      min-height: 0;
    }
    #renderCanvas {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      touch-action: none;
      outline: none;
      display: block;
    }
    #loading {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #eaf2ff;
      font-size: 15px;
      background: #05070d;
      z-index: 5;
      transition: opacity 0.4s ease;
    }
    #hint {
      position: absolute;
      left: 16px;
      bottom: 20px;
      z-index: 5;
      margin: 0;
      font-size: 12px;
      color: #eaf2ff;
      opacity: 0.6;
      text-shadow: 0 1px 3px rgba(0, 0, 0, 0.6);
      pointer-events: none;
    }
    #viewControls {
      position: absolute;
      left: 50%;
      bottom: 20px;
      transform: translateX(-50%);
      z-index: 6;
      display: none;
      flex-wrap: nowrap;
      align-items: center;
      justify-content: center;
      gap: 6px;
      max-width: calc(100% - 24px);
      padding: 6px;
      border-radius: 999px;
      background: rgba(20, 24, 36, 0.7);
      border: 1px solid rgba(234, 242, 255, 0.2);
      backdrop-filter: blur(6px);
      overflow-x: auto;
      scrollbar-width: none;
    }
    #viewControls::-webkit-scrollbar {
      display: none;
    }
    #viewControls.ready {
      display: flex;
    }
    #viewControls .divider {
      width: 1px;
      align-self: stretch;
      background: rgba(234, 242, 255, 0.2);
      margin: 4px 2px;
      flex: 0 0 auto;
    }
    .viewBtn {
      appearance: none;
      border: 1px solid rgba(234, 242, 255, 0.2);
      background: rgba(234, 242, 255, 0.06);
      color: #eaf2ff;
      font-size: 11px;
      font-weight: 600;
      font-family: inherit;
      height: 38px;
      min-width: 38px;
      padding: 0 11px;
      border-radius: 999px;
      cursor: pointer;
      white-space: nowrap;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 5px;
      flex: 0 0 auto;
      transition: background 0.15s ease, border-color 0.15s ease;
    }
    .viewBtn.iconOnly {
      width: 38px;
      padding: 0;
    }
    .viewBtn svg {
      flex: 0 0 auto;
      display: block;
    }
    .viewBtn:hover {
      background: rgba(234, 242, 255, 0.14);
    }
    .viewBtn.active {
      background: #eaf2ff;
      color: #12141c;
      border-color: #eaf2ff;
    }
    .viewBtn[hidden],
    .divider[hidden] {
      display: none;
    }
    .viewBtn svg[hidden] {
      display: none;
    }

    /* ---- Footer dropdown groups (Views, Scale). Positioned via JS
       (left/bottom set at open-time from the trigger button's rect) rather
       than CSS anchored to the trigger — #viewControls needs overflow-x:
       auto for its horizontal button-scroll, which per the CSS overflow
       spec forces overflow-y to clip too, so an absolutely-positioned
       child anchored *inside* it gets cut off. These live as siblings of
       #viewControls (direct children of #canvasWrap) instead. ---- */
    .dropdownMenu {
      position: absolute;
      transform: translateX(-50%);
      display: flex;
      flex-direction: column;
      gap: 2px;
      min-width: 160px;
      padding: 6px;
      border-radius: 14px;
      background: rgba(20, 24, 36, 0.92);
      border: 1px solid rgba(234, 242, 255, 0.2);
      backdrop-filter: blur(6px);
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.35);
      z-index: 20;
    }
    .dropdownMenu[hidden] {
      display: none;
    }
    .dropdownItem {
      appearance: none;
      display: flex;
      align-items: center;
      gap: 8px;
      width: 100%;
      padding: 8px 10px;
      border: none;
      border-radius: 8px;
      background: transparent;
      color: #eaf2ff;
      font-size: 13px;
      font-family: inherit;
      cursor: pointer;
      text-align: left;
      white-space: nowrap;
    }
    .dropdownItem:hover {
      background: rgba(234, 242, 255, 0.1);
    }
    .dropdownItem.active {
      background: rgba(120, 140, 255, 0.28);
    }
    .dropdownItem svg {
      flex: 0 0 auto;
      display: block;
    }

    /* ---- Right-side panels (Collections, Animations) ---- */
    #rightPanels {
      position: absolute;
      top: 16px;
      right: 16px;
      z-index: 6;
      display: flex;
      flex-direction: column;
      gap: 12px;
      width: 180px;
      max-height: calc(100% - 100px);
    }
    #collectionsPanel,
    #animationsPanel {
      flex: 0 1 auto;
      min-height: 0;
      overflow-y: auto;
      border-radius: 14px;
      background: rgba(20, 24, 36, 0.7);
      border: 1px solid rgba(234, 242, 255, 0.2);
      backdrop-filter: blur(6px);
    }
    #collectionsPanel[hidden],
    #animationsPanel[hidden] {
      display: none;
    }
    .panelHeader {
      padding: 10px 14px 6px;
      font-size: 10px;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: #9fb3ff;
    }
    #collectionsList,
    #animationsList {
      display: flex;
      flex-direction: column;
      padding: 2px 6px 8px;
    }
    .collectionRow {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 6px 8px;
      border-radius: 8px;
      font-size: 13px;
      color: #eaf2ff;
      cursor: pointer;
    }
    .collectionRow:hover {
      background: rgba(234, 242, 255, 0.08);
    }
    .collectionRow input {
      flex: 0 0 auto;
      accent-color: #9fb3ff;
      cursor: pointer;
    }
    .collectionRow span {
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    @media (max-width: 480px) {
      #hint {
        display: none;
      }
    }
  </style>
</head>
<body>
  <aside id="sidebar">
    <div class="sidebar-header">
      <span class="eyebrow">Babylon.js Portal</span>
      <h1>Babylon Projects</h1>
      <p>Pick a project to load it in the viewer.</p>
    </div>
    <nav id="projectList"></nav>
    <div class="sidebar-footer">
      Built with <a href="https://www.babylonjs.com/" target="_blank" rel="noopener">Babylon.js</a>.
    </div>
  </aside>
  <div id="sidebarBackdrop"></div>

  <main id="viewer">
    <div id="topbar">
      <button id="sidebarToggle" type="button" aria-label="Toggle project list">
        <svg viewBox="0 0 20 20" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round">
          <path d="M3 5.5h14" />
          <path d="M3 10h14" />
          <path d="M3 14.5h14" />
        </svg>
      </button>
      <div class="titles">
        <h2 id="projectTitle">&nbsp;</h2>
        <p id="projectContext">&nbsp;</p>
      </div>
    </div>

    <div id="canvasWrap">
      <canvas id="renderCanvas"></canvas>
      <div id="loading">Loading&hellip;</div>
      <p id="hint">Left-drag to orbit &middot; scroll to zoom &middot; right-drag to pan</p>

      <div id="rightPanels">
        <div id="collectionsPanel" hidden>
          <div class="panelHeader">Collections</div>
          <div id="collectionsList"></div>
        </div>
        <div id="animationsPanel" hidden>
          <div class="panelHeader">Animations</div>
          <div id="animationsList"></div>
        </div>
      </div>

      <div class="dropdownMenu" id="viewsMenu" hidden>
        <button class="dropdownItem" data-view="topVertical" type="button">
          <svg viewBox="0 0 20 20" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round">
            <rect x="6" y="2.5" width="8" height="15" rx="1.2" />
          </svg>
          <span>Portrait</span>
        </button>
        <button class="dropdownItem" data-view="topHorizontal" type="button">
          <svg viewBox="0 0 20 20" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round">
            <rect x="2.5" y="6" width="15" height="8" rx="1.2" />
          </svg>
          <span>Landscape</span>
        </button>
        <button class="dropdownItem" data-view="diorama30" type="button">
          <svg viewBox="0 0 20 20" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round">
            <path d="M10 2.5L17 6.5V13.5L10 17.5L3 13.5V6.5L10 2.5Z" />
            <path d="M10 10.5V17.5" />
            <path d="M3 6.5L10 10.5L17 6.5" />
          </svg>
          <span>Diorama 30&deg;</span>
        </button>
        <button class="dropdownItem" data-view="diorama60" type="button">
          <svg viewBox="0 0 20 20" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round">
            <path d="M10 2.5L17 6.5V13.5L10 17.5L3 13.5V6.5L10 2.5Z" />
            <path d="M10 10.5V17.5" />
            <path d="M3 6.5L10 10.5L17 6.5" />
          </svg>
          <span>Diorama 60&deg;</span>
        </button>
      </div>

      <div class="dropdownMenu" id="scaleMenu" hidden>
        <button class="dropdownItem active" data-scale="1" type="button"><span>100%</span></button>
        <button class="dropdownItem" data-scale="0.5" type="button"><span>50%</span></button>
        <button class="dropdownItem" data-scale="0.25" type="button"><span>25%</span></button>
      </div>

      <div id="viewControls">
        <button class="viewBtn" id="btnDownload" type="button" title="Download PNG" aria-label="Download PNG">
          <svg viewBox="0 0 20 20" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
            <path d="M10 3v9" />
            <path d="M6.5 9L10 12.5L13.5 9" />
            <path d="M4 15.5h12" />
          </svg>
          <span>Save</span>
        </button>
        <div class="divider"></div>

        <button class="viewBtn" id="btnViewsTrigger" type="button" aria-haspopup="true" aria-expanded="false" title="Camera views" aria-label="Camera views">
          <svg viewBox="0 0 20 20" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round">
            <path d="M10 2.5L17 6.5V13.5L10 17.5L3 13.5V6.5L10 2.5Z" />
            <path d="M10 10.5V17.5" />
            <path d="M3 6.5L10 10.5L17 6.5" />
          </svg>
          <span>Views</span>
        </button>

        <div class="divider"></div>

        <button class="viewBtn" id="btnScaleTrigger" type="button" aria-haspopup="true" aria-expanded="false" title="Model scale" aria-label="Model scale">
          <svg viewBox="0 0 20 20" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
            <path d="M3 8V3h5" />
            <path d="M17 12v5h-5" />
            <path d="M3 3l6 6" />
            <path d="M17 17l-6-6" />
          </svg>
          <span>Scale</span>
        </button>

        <div class="divider"></div>
        <button class="viewBtn" id="btnToggleShadows" type="button" title="Turn shadows off" aria-label="Toggle shadows">
          <svg viewBox="0 0 20 20" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="10" cy="7.5" r="3" />
            <ellipse cx="10" cy="16" rx="6" ry="1.5" fill="currentColor" stroke="none" opacity="0.55" />
          </svg>
          <span>Shadows</span>
        </button>
        <div class="divider"></div>
        <button class="viewBtn" id="btnOrbit" type="button" title="Stop camera orbit" aria-label="Toggle camera orbit">
          <svg class="icon-pause" viewBox="0 0 20 20" width="18" height="18" fill="currentColor" stroke="none">
            <rect x="6" y="4" width="3" height="12" rx="1" />
            <rect x="11" y="4" width="3" height="12" rx="1" />
          </svg>
          <svg class="icon-play" style="display: none" viewBox="0 0 20 20" width="18" height="18" fill="currentColor" stroke="none">
            <path d="M6.5 4.5L15 10L6.5 15.5Z" />
          </svg>
          <span>Orbit</span>
        </button>
      </div>
    </div>
  </main>

  <script src="https://cdn.babylonjs.com/babylon.js"></script>
  <script src="https://cdn.babylonjs.com/materials/babylonjs.materials.min.js"></script>
  <script src="https://cdn.babylonjs.com/loaders/babylonjs.loaders.min.js"></script>
  <script>
    // ---- Project list ----
    // modelPath is "<rootUrl>|<filename>" split at load time. Add new
    // projects here — no other code needs to change.
    const PROJECTS = [
      {
        id: "lenovo",
        tag: "Scene 01",
        title: "Lenovo Event",
        context: "Placeholder model — to be replaced",
        rootUrl: "projects/lenovo-event/",
        fileName: "lenovo-floorplan.glb",
      },
      {
        id: "server-cabinet",
        tag: "Scene 02",
        title: "Server Cabinet",
        context: "Rack cabinet — try the door toggle in the Animations panel",
        rootUrl: "projects/server-cabinet/",
        fileName: "server-cabinet.glb",
        // This model's own embedded animation would otherwise fight the
        // manually-driven door bone every frame if both played at once, so
        // it defaults to off in the Animations panel — see below.
        stopEmbeddedAnimation: true,
      },
      {
        id: "storm-location-plan",
        tag: "Scene 03",
        title: "Storm Location Plan",
        context: "Site plan",
        rootUrl: "projects/storm-location-plan/",
        fileName: "storm-location-plan.glb",
      },
    ];

    const canvas = document.getElementById("renderCanvas");
    const sidebar = document.getElementById("sidebar");
    const sidebarBackdrop = document.getElementById("sidebarBackdrop");
    const projectListEl = document.getElementById("projectList");
    const projectTitleEl = document.getElementById("projectTitle");
    const projectContextEl = document.getElementById("projectContext");
    const loadingEl = document.getElementById("loading");
    const viewControlsEl = document.getElementById("viewControls");

    // alpha: true lets the PNG export below capture a transparent
    // background; it has no effect on normal rendering (the scene's clear
    // color stays fully opaque except during that export).
    const engine = new BABYLON.Engine(canvas, true, { stencil: true, preserveDrawingBuffer: true, alpha: true });

    // Reassigned on every project switch; other code below reads these
    // through closures, so it always sees whatever is currently loaded.
    let scene = null;
    let camera = null;
    let modelMin = null, modelMax = null, modelCenter = BABYLON.Vector3.Zero(), modelSize = 12;
    let userInteracted = false;
    let orbitEnabled = true;
    let modelLight = null;
    let shadowGenerator = null;
    let shadowCasterMeshes = [];
    let shadowsOn = true;

    // ---- Cabinet door toggle (model-specific: driven by the Animations
    // panel below, only listed when the loaded model has a skeleton bone
    // named "bone1") ----
    const DOOR_CLOSED = BABYLON.Quaternion.Identity();
    const DOOR_OPEN = BABYLON.Quaternion.RotationAxis(BABYLON.Vector3.Up(), BABYLON.Tools.ToRadians(128));
    let cabinetDoorNode = null;
    let cabinetDoorOpen = false;

    function animateRotationQuaternion(node, toQuaternion, durationMs) {
      const fps = 30;
      const ease = new BABYLON.QuadraticEase();
      ease.setEasingMode(BABYLON.EasingFunction.EASINGMODE_EASEINOUT);
      BABYLON.Animation.CreateAndStartAnimation(
        "doorToggle",
        node,
        "rotationQuaternion",
        fps,
        Math.round((durationMs / 1000) * fps),
        node.rotationQuaternion ? node.rotationQuaternion.clone() : BABYLON.Quaternion.Identity(),
        toQuaternion,
        BABYLON.Animation.ANIMATIONLOOPMODE_CONSTANT,
        ease
      );
    }

    // ---- Camera orbit play/pause (scene-wide: works the same for every
    // project). Independent of the "stop idle-spin on first interaction"
    // behavior below — pressing Play always resumes it, even after the user
    // has clicked a view-preset button. ----
    const btnOrbitEl = document.getElementById("btnOrbit");
    const orbitPauseIconEl = btnOrbitEl.querySelector(".icon-pause");
    const orbitPlayIconEl = btnOrbitEl.querySelector(".icon-play");
    function updateOrbitButtonUI() {
      // SVG elements don't reliably reflect the `hidden` IDL property to
      // the content attribute the way HTML elements do, so [hidden] CSS
      // never matched here — toggle display directly instead.
      orbitPauseIconEl.style.display = orbitEnabled ? "" : "none";
      orbitPlayIconEl.style.display = orbitEnabled ? "none" : "";
      btnOrbitEl.classList.toggle("active", !orbitEnabled);
      btnOrbitEl.title = orbitEnabled ? "Stop camera orbit" : "Play camera orbit";
    }
    btnOrbitEl.addEventListener("click", () => {
      orbitEnabled = !orbitEnabled;
      if (orbitEnabled) userInteracted = false;
      updateOrbitButtonUI();
    });

    // ---- Shadow toggle (scene-wide: works the same for every project) ----
    const btnToggleShadowsEl = document.getElementById("btnToggleShadows");
    btnToggleShadowsEl.addEventListener("click", () => {
      if (!shadowGenerator) return;
      shadowsOn = !shadowsOn;
      shadowCasterMeshes.forEach((mesh) => {
        mesh.receiveShadows = shadowsOn;
        if (shadowsOn) shadowGenerator.addShadowCaster(mesh);
        else shadowGenerator.removeShadowCaster(mesh);
      });
      btnToggleShadowsEl.classList.toggle("active", !shadowsOn);
      btnToggleShadowsEl.title = shadowsOn ? "Turn shadows off" : "Turn shadows on";
    });

    // ---- Collections panel (model-specific: only shown when the loaded
    // model has top-level "group" nodes — i.e. Blender Empties that objects
    // were parented to before export, one per Collection) ----
    const collectionsPanelEl = document.getElementById("collectionsPanel");
    const collectionsListEl = document.getElementById("collectionsList");

    function escapeRegExp(s) {
      return s.replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
    }

    // A real collection group is a node with no geometry of its own whose
    // children are distinct objects — as opposed to (a) a multi-material
    // mesh, which the glTF loader also splits into a geometry-less parent
    // node plus per-material "<name>_primitiveN" child meshes, or (b) an
    // Armature: Babylon's glTF loader treats the armature object itself as
    // the skeleton's first "bone", not a Collection group.
    function findCollectionGroups(scene, rootNode) {
      const skeletonNodes = new Set();
      scene.skeletons.forEach((sk) => {
        sk.bones.forEach((b) => {
          const n = b.getTransformNode();
          if (n) skeletonNodes.add(n);
        });
      });

      const candidates = [...scene.meshes, ...scene.transformNodes];
      return candidates
        .filter((node) => {
          if (node.parent !== rootNode) return false;
          if (skeletonNodes.has(node)) return false;
          if (node.getTotalVertices && node.getTotalVertices() > 0) return false;
          const children = node.getChildren();
          if (!children.length) return false;
          const primitivePattern = new RegExp(`^${escapeRegExp(node.name)}_primitive\\d+$`);
          return !children.every((c) => primitivePattern.test(c.name));
        })
        .map((node) => ({ name: node.name, node }));
    }

    function renderCollectionsPanel(groups) {
      collectionsListEl.innerHTML = "";
      collectionsPanelEl.hidden = groups.length === 0;
      groups.forEach((group) => {
        const row = document.createElement("label");
        row.className = "collectionRow";

        const checkbox = document.createElement("input");
        checkbox.type = "checkbox";
        checkbox.checked = group.node.isEnabled(false);
        checkbox.addEventListener("change", () => {
          group.node.setEnabled(checkbox.checked);
        });

        const label = document.createElement("span");
        label.textContent = group.name;

        row.appendChild(checkbox);
        row.appendChild(label);
        collectionsListEl.appendChild(row);
      });
    }

    // ---- Animations panel (generic: one toggle row per animation-like
    // "state" the loaded model has — an embedded glTF AnimationGroup, or a
    // custom scripted toggle like the cabinet door. Each item just needs a
    // name, an initial checked state, and an onToggle(checked) callback.) ----
    const animationsPanelEl = document.getElementById("animationsPanel");
    const animationsListEl = document.getElementById("animationsList");

    function renderAnimationsPanel(items) {
      animationsListEl.innerHTML = "";
      animationsPanelEl.hidden = items.length === 0;
      items.forEach((item) => {
        const row = document.createElement("label");
        row.className = "collectionRow";

        const checkbox = document.createElement("input");
        checkbox.type = "checkbox";
        checkbox.checked = item.checked;
        checkbox.addEventListener("change", () => item.onToggle(checkbox.checked));

        const label = document.createElement("span");
        label.textContent = item.name;

        row.appendChild(checkbox);
        row.appendChild(label);
        animationsListEl.appendChild(row);
      });
    }

    // Fully stops (not just pauses) every Animatable driving an animation
    // group's targets — belt-and-suspenders, since AnimationGroup.stop()
    // alone doesn't reliably stop its underlying per-node Animatables in
    // this Babylon version (see the embedded-animation handling below).
    function stopAnimationGroupFully(scene, ag) {
      ag.stop();
      ag.targetedAnimations.forEach((ta) => {
        scene.getAllAnimatablesByTarget(ta.target).forEach((a) => a.stop());
      });
    }

    // Camera angle presets. Alpha is the horizontal (azimuth) rotation; beta
    // is measured from straight-down (0deg = top-down, 90deg = horizon-level),
    // matching Babylon's ArcRotateCamera convention.
    const VIEWS = {
      topVertical: { alpha: -Math.PI / 2, beta: 0.0001 },
      topHorizontal: { alpha: 0, beta: 0.0001 },
      diorama30: { alpha: -Math.PI / 4, beta: BABYLON.Tools.ToRadians(30) },
      diorama60: { alpha: -Math.PI / 4, beta: BABYLON.Tools.ToRadians(60) },
    };

    function setView(name) {
      const v = VIEWS[name];
      if (!v || !modelMin || !camera) return;
      userInteracted = true;
      camera.target = modelCenter.clone();
      camera.alpha = v.alpha;
      camera.beta = v.beta;
      document.querySelectorAll(".dropdownItem[data-view]").forEach((btn) => {
        btn.classList.toggle("active", btn.dataset.view === name);
      });
    }
    document.querySelectorAll(".dropdownItem[data-view]").forEach((btn) => {
      btn.addEventListener("click", () => setView(btn.dataset.view));
    });

    // ---- Footer dropdown groups (Views, Scale): each is a trigger button
    // paired with a popover menu of .dropdownItem buttons. The menus live
    // outside #viewControls in the DOM (see the CSS comment above), so each
    // pairing is explicit here rather than inferred from DOM position. Only
    // one open at a time; clicking anywhere else closes whichever is open.
    const canvasWrapEl = document.getElementById("canvasWrap");
    const DROPDOWNS = [
      { trigger: document.getElementById("btnViewsTrigger"), menu: document.getElementById("viewsMenu") },
      { trigger: document.getElementById("btnScaleTrigger"), menu: document.getElementById("scaleMenu") },
    ];
    function closeAllDropdowns() {
      DROPDOWNS.forEach(({ trigger, menu }) => {
        menu.hidden = true;
        trigger.setAttribute("aria-expanded", "false");
      });
    }
    function positionMenuAboveTrigger(menu, trigger) {
      const wrapRect = canvasWrapEl.getBoundingClientRect();
      const trect = trigger.getBoundingClientRect();
      menu.style.left = trect.left + trect.width / 2 - wrapRect.left + "px";
      menu.style.bottom = wrapRect.bottom - trect.top + 10 + "px";
    }
    DROPDOWNS.forEach(({ trigger, menu }) => {
      trigger.addEventListener("click", (e) => {
        e.stopPropagation();
        const isOpen = !menu.hidden;
        closeAllDropdowns();
        if (!isOpen) {
          positionMenuAboveTrigger(menu, trigger);
          menu.hidden = false;
          trigger.setAttribute("aria-expanded", "true");
        }
      });
    });
    document.addEventListener("click", () => closeAllDropdowns());

    // Measures the world-space bounding box across the given meshes and
    // updates modelMin/modelMax/modelCenter/modelSize. Returns false (and
    // leaves those untouched) if none of the meshes have geometry.
    function computeModelBounds(meshes) {
      let min = null, max = null;
      meshes.forEach((mesh) => {
        const info = mesh.getBoundingInfo && mesh.getBoundingInfo();
        if (!info) return;
        const bMin = info.boundingBox.minimumWorld;
        const bMax = info.boundingBox.maximumWorld;
        min = min ? BABYLON.Vector3.Minimize(min, bMin) : bMin.clone();
        max = max ? BABYLON.Vector3.Maximize(max, bMax) : bMax.clone();
      });
      if (!min || !max) return false;
      modelMin = min;
      modelMax = max;
      modelCenter = min.add(max).scale(0.5);
      modelSize = max.subtract(min).length() || 12;
      return true;
    }

    // Babylon's default wheelPrecision (3) is an absolute step size, not
    // scaled to the model — it feels fine on a ~30-unit floor plan but far
    // too fast on an ~8-unit cabinet. Scaling it (and the radius limits)
    // inversely with modelSize keeps zoom feeling consistent across very
    // differently-sized models, and lets scale changes (see applyScale
    // below) keep the zoom range sensible for the new size (84 is
    // calibrated so a ~28-unit model, like the Cove floor plan was, lands
    // close to the default wheelPrecision of 3).
    function applyZoomLimitsForModelSize() {
      camera.lowerRadiusLimit = modelSize * 0.1;
      camera.upperRadiusLimit = modelSize * 4;
      camera.wheelPrecision = Math.max(3, 84 / modelSize);
      // Right-drag panning moves the camera target by a *fixed* number of
      // world units per pixel (panningSensibility is the divisor — lower
      // means faster), and Babylon doesn't scale that to content size on
      // its own. On a real-world-scale model (e.g. a large site plan) that
      // fixed rate barely dents it, which reads as "panning is very slow."
      // Scaled inversely with modelSize using the same ~28-unit reference
      // point as wheelPrecision above (so it lands close to Babylon's
      // default of 1000 there); floored so it can't get so small that
      // panning turns twitchy on extremely large models.
      camera.panningSensibility = Math.max(200, 28000 / modelSize);
    }

    // The shadow map's depth range and bias are tuned for the ~10-30 unit
    // models this app started with. On something much larger (e.g. a
    // real-world-scale site plan), the old fixed shadowMaxZ could clip
    // shadows for geometry beyond it, and the old fixed bias becomes
    // relatively too small for the scene's depth range, both reading as
    // "shadows look weird." Both scale from modelSize using the same
    // ~28-unit reference point as wheelPrecision, so this is a no-op for
    // the small/medium models it was already tuned for.
    function applyShadowRangeForModelSize() {
      if (!modelLight || !shadowGenerator) return;
      modelLight.shadowMaxZ = Math.max(1000, modelSize * 4);
      shadowGenerator.bias = 0.0001 * Math.max(1, modelSize / 28);
    }

    // ---- Model scale (Scale dropdown: 100% / 50% / 25%). Scales every
    // top-level imported node — everything else (meshes, shadows, the door
    // bone, collections) is a descendant and scales right along with it.
    // Camera target/radius are left alone so the change is visible in
    // place; only the zoom range and speed get recalculated for the new
    // size.
    let modelRootNodes = [];
    let modelMeshes = [];

    function applyScale(factor) {
      if (!modelRootNodes.length || !scene) return;
      modelRootNodes.forEach((node) => {
        node.scaling = new BABYLON.Vector3(factor, factor, factor);
      });
      scene.render(); // force world matrices to refresh before re-measuring
      if (computeModelBounds(modelMeshes)) {
        applyZoomLimitsForModelSize();
        applyShadowRangeForModelSize();
      }
      document.querySelectorAll(".dropdownItem[data-scale]").forEach((btn) => {
        btn.classList.toggle("active", parseFloat(btn.dataset.scale) === factor);
      });
    }
    document.querySelectorAll(".dropdownItem[data-scale]").forEach((btn) => {
      btn.addEventListener("click", () => applyScale(parseFloat(btn.dataset.scale)));
    });

    function pad2(n) {
      return String(n).padStart(2, "0");
    }
    function timestampedFilename() {
      const d = new Date();
      const stamp =
        `${d.getFullYear()}${pad2(d.getMonth() + 1)}${pad2(d.getDate())}_` +
        `${pad2(d.getHours())}${pad2(d.getMinutes())}${pad2(d.getSeconds())}`;
      return `image_(${stamp}).png`;
    }
    // Renders one frame with a transparent clear color, captures it, then
    // restores the normal opaque background for the next animation frame.
    document.getElementById("btnDownload").addEventListener("click", () => {
      if (!scene) return;
      const originalClearColor = scene.clearColor.clone();
      scene.clearColor = new BABYLON.Color4(0, 0, 0, 0);
      scene.render();
      const dataUrl = canvas.toDataURL("image/png");
      scene.clearColor = originalClearColor;

      const a = document.createElement("a");
      a.href = dataUrl;
      a.download = timestampedFilename();
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
    });

    // ---- Sidebar open/close ----
    function setSidebarOpen(open) {
      sidebar.classList.toggle("open", open);
    }
    document.getElementById("sidebarToggle").addEventListener("click", () => {
      setSidebarOpen(!sidebar.classList.contains("open"));
    });
    sidebarBackdrop.addEventListener("click", () => setSidebarOpen(false));
    setSidebarOpen(window.matchMedia("(min-width: 900px)").matches);

    function renderProjectList(activeId) {
      projectListEl.innerHTML = "";
      PROJECTS.forEach((p) => {
        const btn = document.createElement("button");
        btn.type = "button";
        btn.className = "projectItem" + (p.id === activeId ? " active" : "");
        btn.innerHTML = `<span class="tag">${p.tag}</span><span class="name">${p.title}</span>`;
        btn.addEventListener("click", () => {
          selectProject(p.id);
          if (!window.matchMedia("(min-width: 900px)").matches) setSidebarOpen(false);
        });
        projectListEl.appendChild(btn);
      });
    }

    // ---- Scene (re)construction ----
    // Tears down the previous scene entirely and builds a fresh one for the
    // given project. Camera controls are left at Babylon's defaults
    // (left-drag orbit, right-drag pan, scroll zoom) — same as the Babylon.js
    // sandbox, no custom overrides.
    function loadProject(project) {
      loadingEl.style.display = "flex";
      loadingEl.style.opacity = "1";
      viewControlsEl.classList.remove("ready");
      document.querySelectorAll(".dropdownItem[data-view]").forEach((b) => b.classList.remove("active"));
      document.querySelectorAll(".dropdownItem[data-scale]").forEach((b) => b.classList.toggle("active", b.dataset.scale === "1"));
      closeAllDropdowns();
      projectTitleEl.textContent = project.title;
      projectContextEl.textContent = project.context;

      if (scene) scene.dispose();

      scene = new BABYLON.Scene(engine);
      scene.clearColor = new BABYLON.Color4(0.05, 0.06, 0.09, 1);

      camera = new BABYLON.ArcRotateCamera("camera", -Math.PI / 2.4, Math.PI / 2.5, 12, BABYLON.Vector3.Zero(), scene);
      camera.attachControl(canvas, true);
      camera.lowerRadiusLimit = 0.5;

      // Babylon's default studio environment texture. PBR materials use
      // this for ambient/reflected light, which is what gives them depth
      // instead of the flat look you get from direct lights alone.
      scene.createDefaultEnvironment({ createSkybox: false, createGround: false });
      // The environment texture and the hemispheric light both illuminate
      // from all directions and aren't blocked by the ShadowGenerator (only
      // the model's own light below is) — at full strength they wash out
      // shadows almost entirely. Dialed back so shadows stay visible while
      // materials keep most of the richness the environment texture gives.
      scene.environmentIntensity = 0.45;

      const hemi = new BABYLON.HemisphericLight("hemi", new BABYLON.Vector3(0, 1, 0), scene);
      hemi.intensity = 0.35;

      modelMin = null;
      modelMax = null;
      modelCenter = BABYLON.Vector3.Zero();
      modelSize = 12;
      modelRootNodes = [];
      modelMeshes = [];
      userInteracted = false;
      orbitEnabled = true;
      updateOrbitButtonUI();
      cabinetDoorNode = null;
      cabinetDoorOpen = false;
      collectionsListEl.innerHTML = "";
      collectionsPanelEl.hidden = true;
      animationsListEl.innerHTML = "";
      animationsPanelEl.hidden = true;
      modelLight = null;
      shadowGenerator = null;
      shadowCasterMeshes = [];
      shadowsOn = true;
      btnToggleShadowsEl.classList.remove("active");
      btnToggleShadowsEl.title = "Turn shadows off";

      // Idle auto-rotate the camera slowly until the user interacts (or
      // pauses it explicitly via the Orbit button)
      scene.onBeforeRenderObservable.add(() => {
        if (orbitEnabled && !userInteracted) {
          camera.alpha += engine.getDeltaTime() * 0.00008;
        }
      });

      BABYLON.SceneLoader.ImportMeshAsync("", project.rootUrl, project.fileName, scene).then((result) => {
        // Every animation-like "state" this model offers gets one row in
        // the Animations panel — built up as we detect each kind below.
        const animationItems = [];

        // Babylon doesn't auto-play a model's embedded animation on import
        // via ImportMeshAsync — it just sits there loaded but static unless
        // something starts it. Most models (e.g. Lenovo's humanoid) default
        // to on; server-cabinet's default to off since it also drives the
        // door bone the "Cabinet Door" toggle below controls manually, and a
        // playing animation would fight that every frame if both ran at
        // once — but the user can still switch it on from the panel.
        result.animationGroups.forEach((ag) => {
          const startEnabled = !project.stopEmbeddedAnimation;
          if (startEnabled) ag.play(true);
          else stopAnimationGroupFully(scene, ag);
          animationItems.push({
            name: ag.name || "Animation",
            checked: startEnabled,
            onToggle: (checked) => {
              if (checked) {
                stopAnimationGroupFully(scene, ag);
                ag.play(true);
              } else {
                stopAnimationGroupFully(scene, ag);
              }
            },
          });
        });

        // Prefer the glTF's own "Light" node if this model has one
        // (position/direction authored in Blender) — matches the setup
        // tuned in the Babylon Inspector rather than a light we position
        // ourselves. Falls back to a generic directional light otherwise.
        modelLight = scene.getLightByName("Light");
        let usingFallbackLight = false;
        if (modelLight) {
          // Babylon's DirectionalLight doesn't re-derive .direction from a
          // parent node's rotation the way meshes do — the raw imported
          // value is the glTF default [0,0,-1] (perfectly horizontal) when
          // the real rotation lives on the light's parent node instead.
          // Bake the parent's rotation into the direction once, then detach.
          if (modelLight.parent) {
            const worldMatrix = modelLight.parent.getWorldMatrix();
            modelLight.direction = BABYLON.Vector3.TransformNormal(new BABYLON.Vector3(0, 0, -1), worldMatrix).normalize();
            modelLight.parent = null;
          }
          modelLight.intensity = 1;
        } else {
          modelLight = new BABYLON.DirectionalLight("sun", new BABYLON.Vector3(-0.5, -1, 0.4), scene);
          modelLight.intensity = 1.4;
          usingFallbackLight = true;
        }
        modelLight.autoUpdateExtends = true;
        modelLight.autoCalcShadowZBounds = false;
        modelLight.shadowMinZ = 0;
        // shadowMaxZ and bias depend on modelSize — set below by
        // applyShadowRangeForModelSize() once the bounding box is known.

        shadowGenerator = new BABYLON.ShadowGenerator(1024, modelLight);
        shadowGenerator.normalBias = 0;
        shadowGenerator.darkness = 0;
        // So transparent meshes (e.g. a cage's mesh netting) cast a shadow
        // shaped by their alpha instead of a solid opaque blob.
        shadowGenerator.transparencyShadow = true;

        // Auto-frame the camera around the loaded model's bounding box
        result.meshes.forEach((mesh) => {
          if (mesh.getTotalVertices() > 0) {
            mesh.receiveShadows = true;
            shadowGenerator.addShadowCaster(mesh);
            shadowCasterMeshes.push(mesh);
          }
        });
        modelMeshes = result.meshes;
        modelRootNodes = [...result.meshes, ...(result.transformNodes || [])].filter((n) => !n.parent);
        if (computeModelBounds(modelMeshes)) {
          camera.setTarget(modelCenter);
          camera.radius = modelSize * 1.2;
          applyZoomLimitsForModelSize();
          applyShadowRangeForModelSize();
          if (usingFallbackLight) {
            modelLight.position = modelCenter.add(new BABYLON.Vector3(modelSize, modelSize * 2, -modelSize));
          }
        }

        // If this model has a skeleton with a bone named "bone1" (e.g. the
        // server cabinet's door hinge), add a door toggle to the Animations
        // panel, wired to that bone's linked transform node.
        result.skeletons.forEach((sk) => {
          const bone1 = sk.bones.find((b) => b.name === "bone1");
          if (bone1) cabinetDoorNode = bone1.getTransformNode() || bone1;
        });
        if (cabinetDoorNode) {
          animationItems.push({
            name: "Cabinet Door",
            checked: cabinetDoorOpen,
            onToggle: (checked) => {
              userInteracted = true;
              cabinetDoorOpen = checked;
              animateRotationQuaternion(cabinetDoorNode, cabinetDoorOpen ? DOOR_OPEN : DOOR_CLOSED, 500);
            },
          });
        }
        renderAnimationsPanel(animationItems);

        // If the model has top-level Blender-Collection group nodes, show
        // a panel to toggle each one's visibility.
        const importRoot = result.meshes.find((m) => m.name === "__root__");
        if (importRoot) {
          renderCollectionsPanel(findCollectionGroups(scene, importRoot));
        }

        // A cage/canopy netting material ("Material") may have a texture
        // with real alpha data, but Blender's glTF export defaults new
        // materials to Blend Mode "Opaque", which drops alpha on export
        // unless changed — so Babylon loads it fully opaque. Re-enabling
        // alpha here recovers the transparency without re-exporting.
        const cageMat = scene.getMaterialByName("Material");
        if (cageMat && cageMat.albedoTexture) {
          cageMat.albedoTexture.hasAlpha = true;
          cageMat.useAlphaFromAlbedoTexture = true;
          cageMat.transparencyMode = BABYLON.Material.MATERIAL_ALPHABLEND;
          cageMat.backFaceCulling = false;
        }

        viewControlsEl.classList.add("ready");
        loadingEl.style.opacity = "0";
        setTimeout(() => {
          if (loadingEl.style.opacity === "0") loadingEl.style.display = "none";
        }, 400);
      });
    }

    // ---- Routing: hash selects the project, defaults to the first one ----
    function selectProject(id, { pushHistory = true } = {}) {
      const project = PROJECTS.find((p) => p.id === id) || PROJECTS[0];
      if (pushHistory && location.hash.slice(1) !== project.id) {
        history.pushState(null, "", "#" + project.id);
      }
      renderProjectList(project.id);
      loadProject(project);
    }
    window.addEventListener("popstate", () => {
      selectProject(location.hash.slice(1), { pushHistory: false });
    });
    selectProject(location.hash.slice(1), { pushHistory: false });

    engine.runRenderLoop(() => {
      if (scene) scene.render();
    });
    window.addEventListener("resize", () => {
      engine.resize();
    });
  </script>
</body>
</html>
