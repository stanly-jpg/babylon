<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Babylon Playground</title>
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <style>
    html, body {
      overflow: hidden;
      width: 100%;
      height: 100%;
      margin: 0;
      padding: 0;
      background: #0a0812;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
    }
    #renderCanvas {
      width: 100%;
      height: 100%;
      touch-action: none;
      outline: none;
      display: block;
    }
    #overlay {
      position: fixed;
      top: 16px;
      left: 16px;
      color: #f5eaff;
      z-index: 10;
      pointer-events: none;
      text-shadow: 0 1px 3px rgba(0,0,0,0.6);
    }
    #overlay h1 {
      margin: 0 0 4px 0;
      font-size: 20px;
      font-weight: 600;
      letter-spacing: 0.5px;
    }
    #overlay p {
      margin: 0;
      font-size: 13px;
      opacity: 0.8;
    }
    #loading {
      position: fixed;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #f5eaff;
      font-size: 16px;
      background: #0a0812;
      z-index: 20;
      transition: opacity 0.4s ease;
    }
    #homeBtn {
      position: fixed;
      top: 16px;
      right: 16px;
      z-index: 10;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 8px 14px;
      border-radius: 999px;
      background: rgba(28, 20, 36, 0.7);
      border: 1px solid rgba(245, 234, 255, 0.25);
      color: #f5eaff;
      font-size: 13px;
      font-weight: 500;
      text-decoration: none;
      backdrop-filter: blur(6px);
      transition: background 0.2s ease, border-color 0.2s ease;
    }
    #homeBtn:hover {
      background: rgba(28, 20, 36, 0.95);
      border-color: rgba(245, 234, 255, 0.5);
    }
  </style>
</head>
<body>
  <div id="loading">Loading playground…</div>
  <a id="homeBtn" href="../../index.html">&larr; Home</a>
  <div id="overlay">
    <h1>Babylon Playground</h1>
    <p>Left-drag to orbit &middot; scroll to zoom &middot; right-drag to pan</p>
  </div>
  <canvas id="renderCanvas"></canvas>

  <script src="https://cdn.babylonjs.com/babylon.js"></script>
  <script>
    const canvas = document.getElementById("renderCanvas");
    const engine = new BABYLON.Engine(canvas, true, { stencil: true, preserveDrawingBuffer: true });

    const createScene = () => {
      const scene = new BABYLON.Scene(engine);
      scene.clearColor = new BABYLON.Color4(0.04, 0.03, 0.07, 1);

      const camera = new BABYLON.ArcRotateCamera(
        "camera",
        -Math.PI / 2.3,
        Math.PI / 2.5,
        14,
        new BABYLON.Vector3(0, 1.2, 0),
        scene
      );
      camera.attachControl(canvas, true);
      camera.lowerRadiusLimit = 5;
      camera.upperRadiusLimit = 24;
      camera.wheelPrecision = 40;

      const hemi = new BABYLON.HemisphericLight("hemi", new BABYLON.Vector3(0, 1, 0), scene);
      hemi.intensity = 0.5;

      const key = new BABYLON.PointLight("key", new BABYLON.Vector3(6, 8, -4), scene);
      key.intensity = 0.9;
      key.diffuse = new BABYLON.Color3(1, 0.95, 0.85);

      const shadowGen = new BABYLON.ShadowGenerator(1024, key);
      shadowGen.useBlurExponentialShadowMap = true;
      shadowGen.blurKernel = 24;

      const rim = new BABYLON.PointLight("rim", new BABYLON.Vector3(-6, 3, 6), scene);
      rim.diffuse = new BABYLON.Color3(0.5, 0.6, 1);
      rim.intensity = 0.4;

      const groundMat = new BABYLON.StandardMaterial("groundMat", scene);
      groundMat.diffuseColor = new BABYLON.Color3(0.12, 0.1, 0.16);
      groundMat.specularColor = new BABYLON.Color3(0.05, 0.05, 0.05);
      const ground = BABYLON.MeshBuilder.CreateGround("ground", { width: 26, height: 26 }, scene);
      ground.material = groundMat;
      ground.receiveShadows = true;

      const grid = BABYLON.MeshBuilder.CreateGround("grid", { width: 26, height: 26, subdivisions: 26 }, scene);
      grid.position.y = 0.001;
      const gridMat = new BABYLON.StandardMaterial("gridMat", scene);
      gridMat.wireframe = true;
      gridMat.emissiveColor = new BABYLON.Color3(0.25, 0.15, 0.4);
      gridMat.alpha = 0.25;
      grid.material = gridMat;

      const palette = [
        new BABYLON.Color3(0.95, 0.3, 0.5),
        new BABYLON.Color3(0.3, 0.85, 0.75),
        new BABYLON.Color3(0.95, 0.75, 0.25),
        new BABYLON.Color3(0.55, 0.4, 0.95),
        new BABYLON.Color3(0.35, 0.75, 0.95),
        new BABYLON.Color3(0.95, 0.5, 0.25),
      ];

      function shinyMat(name, color, metallic) {
        const m = new BABYLON.StandardMaterial(name, scene);
        m.diffuseColor = color;
        m.specularColor = metallic ? new BABYLON.Color3(1, 1, 1) : new BABYLON.Color3(0.3, 0.3, 0.3);
        m.specularPower = metallic ? 256 : 64;
        m.emissiveColor = color.scale(0.08);
        return m;
      }

      const shapes = [];

      const box = BABYLON.MeshBuilder.CreateBox("box", { size: 1.4 }, scene);
      box.position = new BABYLON.Vector3(-4, 1, -2);
      box.material = shinyMat("boxMat", palette[0], true);
      shapes.push(box);

      const sphere = BABYLON.MeshBuilder.CreateSphere("sphere", { diameter: 1.6, segments: 32 }, scene);
      sphere.position = new BABYLON.Vector3(-1.3, 1.1, 1);
      sphere.material = shinyMat("sphereMat", palette[1], false);
      shapes.push(sphere);

      const torus = BABYLON.MeshBuilder.CreateTorus("torus", { diameter: 1.8, thickness: 0.45, tessellation: 48 }, scene);
      torus.position = new BABYLON.Vector3(1.6, 1.1, -1.5);
      torus.material = shinyMat("torusMat", palette[2], true);
      shapes.push(torus);

      const cylinder = BABYLON.MeshBuilder.CreateCylinder("cylinder", { height: 1.8, diameter: 1.1, tessellation: 32 }, scene);
      cylinder.position = new BABYLON.Vector3(4, 0.9, 0.5);
      cylinder.material = shinyMat("cylMat", palette[3], false);
      shapes.push(cylinder);

      const knot = BABYLON.MeshBuilder.CreateTorusKnot("knot", { radius: 0.7, tube: 0.22, radialSegments: 128, tubularSegments: 64 }, scene);
      knot.position = new BABYLON.Vector3(0, 1.4, 3);
      knot.material = shinyMat("knotMat", palette[4], true);
      shapes.push(knot);

      const cone = BABYLON.MeshBuilder.CreateCylinder("cone", { height: 1.8, diameterTop: 0, diameterBottom: 1.2, tessellation: 32 }, scene);
      cone.position = new BABYLON.Vector3(-4, 0.9, 3);
      cone.material = shinyMat("coneMat", palette[5], false);
      shapes.push(cone);

      shapes.forEach((s) => shadowGen.addShadowCaster(s));

      scene.onBeforeRenderObservable.add(() => {
        const dt = engine.getDeltaTime() / 1000;
        const t = performance.now() / 1000;
        shapes.forEach((s, i) => {
          s.rotation.y += dt * (0.3 + i * 0.05);
          s.position.y = s.position.y + Math.sin(t * 1.2 + i) * 0.0015;
        });
      });

      let userInteracted = false;
      ["pointerdown", "wheel"].forEach((evt) =>
        canvas.addEventListener(evt, () => (userInteracted = true), { passive: true })
      );
      scene.onBeforeRenderObservable.add(() => {
        if (!userInteracted) {
          camera.alpha += engine.getDeltaTime() * 0.00007;
        }
      });

      return scene;
    };

    const scene = createScene();

    engine.runRenderLoop(() => {
      scene.render();
    });

    window.addEventListener("resize", () => {
      engine.resize();
    });

    engine.scenes[0].executeWhenReady(() => {
      const loading = document.getElementById("loading");
      loading.style.opacity = "0";
      setTimeout(() => (loading.style.display = "none"), 400);
    });
  </script>
</body>
</html>
