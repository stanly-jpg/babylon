<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Babylon Orbits</title>
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <style>
    html, body {
      overflow: hidden;
      width: 100%;
      height: 100%;
      margin: 0;
      padding: 0;
      background: #000103;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
    }
    #renderCanvas {
      width: 100%;
      height: 100%;
      touch-action: none;
      outline: none;
      display: block;
    }
    #overlay {
      position: fixed;
      top: 16px;
      left: 16px;
      color: #eaf2ff;
      z-index: 10;
      pointer-events: none;
      text-shadow: 0 1px 3px rgba(0,0,0,0.6);
    }
    #overlay h1 {
      margin: 0 0 4px 0;
      font-size: 20px;
      font-weight: 600;
      letter-spacing: 0.5px;
    }
    #overlay p {
      margin: 0;
      font-size: 13px;
      opacity: 0.8;
    }
    #loading {
      position: fixed;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #eaf2ff;
      font-size: 16px;
      background: #000103;
      z-index: 20;
      transition: opacity 0.4s ease;
    }
    #homeBtn {
      position: fixed;
      top: 16px;
      right: 16px;
      z-index: 10;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 8px 14px;
      border-radius: 999px;
      background: rgba(20, 24, 36, 0.7);
      border: 1px solid rgba(234, 242, 255, 0.25);
      color: #eaf2ff;
      font-size: 13px;
      font-weight: 500;
      text-decoration: none;
      backdrop-filter: blur(6px);
      transition: background 0.2s ease, border-color 0.2s ease;
    }
    #homeBtn:hover {
      background: rgba(20, 24, 36, 0.95);
      border-color: rgba(234, 242, 255, 0.5);
    }
  </style>
</head>
<body>
  <div id="loading">Loading orbits…</div>
  <a id="homeBtn" href="../../index.html">&larr; Home</a>
  <div id="overlay">
    <h1>Babylon Orbits</h1>
    <p>Left-drag to orbit &middot; scroll to zoom &middot; right-drag to pan</p>
  </div>
  <canvas id="renderCanvas"></canvas>

  <script src="https://cdn.babylonjs.com/babylon.js"></script>
  <script>
    const canvas = document.getElementById("renderCanvas");
    const engine = new BABYLON.Engine(canvas, true, { stencil: true, preserveDrawingBuffer: true });

    const createScene = () => {
      const scene = new BABYLON.Scene(engine);
      scene.clearColor = new BABYLON.Color4(0, 0.01, 0.02, 1);

      const camera = new BABYLON.ArcRotateCamera(
        "camera",
        -Math.PI / 2.4,
        Math.PI / 2.6,
        26,
        BABYLON.Vector3.Zero(),
        scene
      );
      camera.attachControl(canvas, true);
      camera.lowerRadiusLimit = 6;
      camera.upperRadiusLimit = 60;
      camera.wheelPrecision = 30;

      // Starfield via a large inverted sphere with a procedural dot texture
      const starTex = new BABYLON.DynamicTexture("starTex", { width: 1024, height: 1024 }, scene);
      const ctx = starTex.getContext();
      ctx.fillStyle = "#000103";
      ctx.fillRect(0, 0, 1024, 1024);
      for (let i = 0; i < 800; i++) {
        const x = Math.random() * 1024;
        const y = Math.random() * 1024;
        const r = Math.random() * 1.4 + 0.2;
        ctx.fillStyle = `rgba(255,255,255,${Math.random() * 0.8 + 0.2})`;
        ctx.beginPath();
        ctx.arc(x, y, r, 0, Math.PI * 2);
        ctx.fill();
      }
      starTex.update();
      const skybox = BABYLON.MeshBuilder.CreateSphere("skybox", { diameter: 400, sideOrientation: BABYLON.Mesh.BACKSIDE }, scene);
      const skyMat = new BABYLON.StandardMaterial("skyMat", scene);
      skyMat.diffuseTexture = starTex;
      skyMat.emissiveTexture = starTex;
      skyMat.disableLighting = true;
      skyMat.backFaceCulling = false;
      skybox.material = skyMat;

      // Sun
      const sun = BABYLON.MeshBuilder.CreateSphere("sun", { diameter: 3.2, segments: 32 }, scene);
      const sunMat = new BABYLON.StandardMaterial("sunMat", scene);
      sunMat.emissiveColor = new BABYLON.Color3(1, 0.75, 0.25);
      sunMat.diffuseColor = new BABYLON.Color3(0, 0, 0);
      sun.material = sunMat;

      const sunLight = new BABYLON.PointLight("sunLight", BABYLON.Vector3.Zero(), scene);
      sunLight.intensity = 1.4;
      sunLight.diffuse = new BABYLON.Color3(1, 0.95, 0.85);

      const glow = new BABYLON.GlowLayer("glow", scene);
      glow.intensity = 0.8;

      // Planets: [name, distance, size, speed, color]
      const planetDefs = [
        { name: "mercury", dist: 5, size: 0.35, speed: 1.6, color: new BABYLON.Color3(0.6, 0.55, 0.5) },
        { name: "venus", dist: 7, size: 0.55, speed: 1.2, color: new BABYLON.Color3(0.85, 0.7, 0.4) },
        { name: "earth", dist: 9.5, size: 0.6, speed: 1.0, color: new BABYLON.Color3(0.25, 0.5, 0.95) },
        { name: "mars", dist: 12, size: 0.45, speed: 0.8, color: new BABYLON.Color3(0.85, 0.35, 0.2) },
        { name: "jupiter", dist: 16, size: 1.3, speed: 0.45, color: new BABYLON.Color3(0.8, 0.65, 0.5) },
        { name: "saturn", dist: 20, size: 1.1, speed: 0.32, color: new BABYLON.Color3(0.85, 0.75, 0.55) },
      ];

      const planetMeshes = planetDefs.map((p) => {
        // Orbit ring
        const ring = BABYLON.MeshBuilder.CreateTorus("ring_" + p.name, { diameter: p.dist * 2, thickness: 0.02, tessellation: 128 }, scene);
        const ringMat = new BABYLON.StandardMaterial("ringMat_" + p.name, scene);
        ringMat.emissiveColor = new BABYLON.Color3(0.2, 0.25, 0.3);
        ringMat.diffuseColor = new BABYLON.Color3(0, 0, 0);
        ringMat.alpha = 0.35;
        ring.material = ringMat;

        const planet = BABYLON.MeshBuilder.CreateSphere(p.name, { diameter: p.size * 2, segments: 24 }, scene);
        const mat = new BABYLON.StandardMaterial(p.name + "Mat", scene);
        mat.diffuseColor = p.color;
        mat.specularColor = new BABYLON.Color3(0.1, 0.1, 0.1);
        planet.material = mat;
        planet.position.x = p.dist;

        if (p.name === "saturn") {
          const rings = BABYLON.MeshBuilder.CreateTorus("saturnRings", { diameter: p.size * 4.4, thickness: p.size * 0.9, tessellation: 64 }, scene);
          rings.scaling.y = 0.05;
          rings.parent = planet;
          const rMat = new BABYLON.StandardMaterial("saturnRingMat", scene);
          rMat.diffuseColor = new BABYLON.Color3(0.75, 0.68, 0.55);
          rMat.alpha = 0.7;
          rings.material = rMat;
        }

        return { mesh: planet, dist: p.dist, speed: p.speed, angle: Math.random() * Math.PI * 2 };
      });

      scene.onBeforeRenderObservable.add(() => {
        const dt = engine.getDeltaTime() / 1000;
        sun.rotation.y += dt * 0.1;
        planetMeshes.forEach((p) => {
          p.angle += dt * 0.25 * p.speed;
          p.mesh.position.x = Math.cos(p.angle) * p.dist;
          p.mesh.position.z = Math.sin(p.angle) * p.dist;
          p.mesh.rotation.y += dt * 0.6;
        });
      });

      let userInteracted = false;
      ["pointerdown", "wheel"].forEach((evt) =>
        canvas.addEventListener(evt, () => (userInteracted = true), { passive: true })
      );
      scene.onBeforeRenderObservable.add(() => {
        if (!userInteracted) {
          camera.alpha += engine.getDeltaTime() * 0.00006;
        }
      });

      return scene;
    };

    const scene = createScene();

    engine.runRenderLoop(() => {
      scene.render();
    });

    window.addEventListener("resize", () => {
      engine.resize();
    });

    engine.scenes[0].executeWhenReady(() => {
      const loading = document.getElementById("loading");
      loading.style.opacity = "0";
      setTimeout(() => (loading.style.display = "none"), 400);
    });
  </script>
</body>
</html>
