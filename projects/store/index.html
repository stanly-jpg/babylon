<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Babylon Store Portal</title>
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <style>
    html, body {
      overflow: hidden;
      width: 100%;
      height: 100%;
      margin: 0;
      padding: 0;
      background: #05070d;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
    }
    #renderCanvas {
      width: 100%;
      height: 100%;
      touch-action: none;
      outline: none;
      display: block;
    }
    #overlay {
      position: fixed;
      top: 16px;
      left: 16px;
      color: #eaf2ff;
      z-index: 10;
      pointer-events: none;
      text-shadow: 0 1px 3px rgba(0,0,0,0.6);
    }
    #overlay h1 {
      margin: 0 0 4px 0;
      font-size: 20px;
      font-weight: 600;
      letter-spacing: 0.5px;
    }
    #overlay p {
      margin: 0;
      font-size: 13px;
      opacity: 0.8;
    }
    #loading {
      position: fixed;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #eaf2ff;
      font-size: 16px;
      background: #05070d;
      z-index: 20;
      transition: opacity 0.4s ease;
    }
    #homeBtn {
      position: fixed;
      top: 16px;
      right: 16px;
      z-index: 10;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 8px 14px;
      border-radius: 999px;
      background: rgba(20, 24, 36, 0.7);
      border: 1px solid rgba(234, 242, 255, 0.25);
      color: #eaf2ff;
      font-size: 13px;
      font-weight: 500;
      text-decoration: none;
      backdrop-filter: blur(6px);
      transition: background 0.2s ease, border-color 0.2s ease;
    }
    #homeBtn:hover {
      background: rgba(20, 24, 36, 0.95);
      border-color: rgba(234, 242, 255, 0.5);
    }
  </style>
</head>
<body>
  <div id="loading">Loading store…</div>
  <a id="homeBtn" href="../../index.html">&larr; Home</a>
  <div id="overlay">
    <h1>Babylon Store</h1>
    <p>Left-drag to orbit &middot; scroll to zoom &middot; right-drag to pan</p>
  </div>
  <canvas id="renderCanvas"></canvas>

  <script src="https://cdn.babylonjs.com/babylon.js"></script>
  <script src="https://cdn.babylonjs.com/materials/babylonjs.materials.min.js"></script>
  <script src="https://cdn.babylonjs.com/loaders/babylonjs.loaders.min.js"></script>
  <script>
    const canvas = document.getElementById("renderCanvas");
    const engine = new BABYLON.Engine(canvas, true, { stencil: true, preserveDrawingBuffer: true });

    // Loads the store scene from store.babylon. Swap that file out to change
    // the scene without touching this loader code.
    BABYLON.SceneLoader.Load("./", "store.babylon", engine, (scene) => {
      const camera = scene.activeCamera;
      camera.attachControl(canvas, true);

      // Idle auto-rotate the camera slowly until the user interacts
      // (only applies if the loaded scene's active camera is an ArcRotateCamera)
      if (camera instanceof BABYLON.ArcRotateCamera) {
        let userInteracted = false;
        ["pointerdown", "wheel"].forEach((evt) =>
          canvas.addEventListener(evt, () => (userInteracted = true), { passive: true })
        );
        scene.onBeforeRenderObservable.add(() => {
          if (!userInteracted) {
            camera.alpha += engine.getDeltaTime() * 0.00008;
          }
        });
      }

      engine.runRenderLoop(() => {
        scene.render();
      });

      const loading = document.getElementById("loading");
      loading.style.opacity = "0";
      setTimeout(() => (loading.style.display = "none"), 400);
    });

    window.addEventListener("resize", () => {
      engine.resize();
    });
  </script>
</body>
</html>
